<head>

<title>日序｜日常記帳</title>
<style>
:root{--bg:#f8f9f6;--card:#fff;--soft:#f0f3ee;--forest:#173f35;--green:#176b58;--pale:#bcd4c9;--ink:#202f2c;--muted:#74817b;--line:#e2e7e1;--red:#c56d50;--radius:22px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #176b5833;outline-offset:2px}.shell{max-width:540px;margin:auto;min-height:100vh;border-inline:1px solid var(--line)}main{padding:22px 22px 110px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:21px;letter-spacing:1px}.mark{background:var(--green);color:white;border-radius:9px;width:28px;height:28px;display:grid;place-items:center}.muted{font-size:12px;color:var(--muted)}h1{font-size:23px;margin:0 0 18px}h2{font-size:16px;margin:0}.head{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.link{color:var(--green);background:none;border:0;font-size:12px;font-weight:700;padding:6px 0}.card{background:var(--card);border:1px solid #e2e7e188;border-radius:var(--radius);padding:16px;margin-bottom:13px}.balance{background:var(--forest);color:white;padding:20px;border-radius:var(--radius);margin-bottom:14px}.balance small{color:var(--pale);font-size:11px}.big{font-size:35px;font-weight:700;letter-spacing:-1px;margin:8px 0 16px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.split span{display:block;color:var(--pale);font-size:11px;margin-bottom:5px}.split b{font-size:21px}.seg{display:flex;gap:4px;padding:4px;background:var(--soft);border-radius:12px}.seg button{flex:1;border:0;border-radius:9px;background:none;color:var(--muted);padding:9px;font-size:13px}.seg button.on{background:white;color:var(--green);font-weight:700}.btn{border:0;border-radius:12px;padding:12px 16px;font-size:13px;font-weight:700}.primary{background:var(--green);color:#fff}.soft{background:var(--soft);color:var(--ink)}.danger{background:#fff0eb;color:var(--red)}.full{width:100%}.amount{width:100%;font-size:34px;font-weight:700;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 0;margin-bottom:14px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.chip{flex:1 0 20%;border:0;border-radius:10px;background:var(--soft);color:var(--muted);padding:10px 8px;font-size:12px}.chip.on{background:var(--green);color:white}.row{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-top:0;border-left:0;border-right:0;text-align:left;color:inherit}.row:last-child{border-bottom:0}.ico{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center}.desc{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{font-size:10px;color:var(--muted);margin-top:4px}.val{font-size:14px;font-weight:700;white-space:nowrap}.income{color:var(--green)}.expense{color:var(--ink)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,540px);display:grid;grid-template-columns:repeat(4,1fr);padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#f8f9f6f2;backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:5}.nav button{border:0;background:none;color:#94a19a;padding:5px;font-size:10px}.nav button b{display:block;font-size:19px;margin-bottom:3px}.nav button.on{color:var(--green);font-weight:800}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:white;font-size:13px;color:var(--ink)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.filter{display:flex;gap:7px;margin:12px 0}.filter button{border:0;border-radius:9px;padding:9px 14px;background:var(--soft);color:var(--muted);font-size:12px}.filter button.on{background:#e2eee7;color:var(--green);font-weight:700}.month{display:flex;align-items:center;justify-content:space-between;margin:8px 0 15px}.month button{border:0;background:none;color:var(--green);font-size:24px}.summary{display:grid;grid-template-columns:repeat(3,1fr);padding:14px 10px}.summary small{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}.summary b{font-size:14px}.bar{height:7px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;border-radius:9px;background:var(--green)}.goal{padding:14px;border-radius:16px;background:white;margin:10px 0}.goalrow{display:flex;justify-content:space-between;gap:10px}.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:12px;background:white;border-radius:17px}.empty b{display:block;color:var(--ink);font-size:14px;margin:8px}.toast{position:fixed;z-index:10;bottom:88px;left:50%;transform:translateX(-50%);background:var(--forest);color:white;padding:10px 15px;border-radius:12px;font-size:12px;display:none;max-width:90vw}.toast.show{display:block}.modal{position:fixed;inset:0;background:#14221d66;z-index:8;display:none;align-items:flex-end;justify-content:center;padding:12px}.modal.show{display:flex}.sheet{background:var(--bg);border-radius:22px;width:min(100%,500px);max-height:85vh;overflow:auto;padding:18px}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sheethead button{border:0;border-radius:50%;width:34px;height:34px;background:var(--soft)}.categoryrow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.smallbtn{border:0;padding:6px 8px;border-radius:8px;background:var(--soft);color:var(--green);font-size:11px}.foot{text-align:center;color:var(--muted);font-size:10px;line-height:1.7;padding:16px 0}
@media(min-width:700px){body{padding:24px 0}.shell{border-radius:26px;overflow:hidden;box-shadow:0 10px 45px #1430270f;min-height:calc(100vh - 48px)}.nav{bottom:24px;border-radius:0 0 26px 26px;border-inline:1px solid var(--line)}}

  main{grid-column:2;grid-row:1;min-width:0;padding:38px clamp(28px,4vw,64px) 48px}

  .nav:before{content:"日序\\A PERSONAL FINANCE";display:block;white-space:pre;line-height:1.65;color:var(--forest);font-size:21px;font-weight:850;letter-spacing:1px;padding:4px 12px 30px}
  .nav button{display:flex;align-items:center;justify-content:flex-start;gap:13px;width:100%;min-height:48px;padding:11px 13px;border:0;border-radius:13px;background:transparent;color:#718078;font-size:14px;text-align:left;transition:background .18s ease,color .18s ease}

  .top{margin:0 0 28px;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .top .brand{display:none}
  .top .muted{font-size:12px}
  h1{font-size:29px;letter-spacing:-.6px;margin-bottom:8px}

  .page-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}
  .page-head h1{margin:0}

  .btn{padding:12px 18px;font-size:13px}
  .card{padding:20px;border-radius:18px;margin-bottom:16px}
  .dashboard-grid{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:20px;align-items:start}

  .dashboard-balance .big{font-size:42px;margin:8px 0 0}

  .dashboard-recent{grid-column:2;grid-row:2;min-width:0}

  .entry-page{max-width:1120px}

  .records-side .summary{display:grid;grid-template-columns:1fr;gap:16px;padding:20px;margin-bottom:16px}
  .records-side .summary small{font-size:12px}

  .records-filter-panel{padding:18px;background:#fff;border:1px solid var(--line);border-radius:18px}
  .records-filter-panel .filter{flex-direction:column;margin:12px 0 0}

  .records-main{min-width:0}
  .search-input{width:100%;padding:14px 16px;margin-bottom:14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:13px}
  .records-list{padding:8px 20px}
  .records-list .row{padding:15px 0;grid-template-columns:44px minmax(0,1fr) 125px}

  .analysis-page .page-head .month{margin:0;min-width:230px}
  .analysis-layout{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:20px;align-items:start}
  .analysis-overview .seg{margin-bottom:16px}

  .analysis-balance .big{font-size:40px}

  .analysis-breakdown{padding:24px;min-height:350px}
  .analysis-breakdown .head{margin-bottom:22px}

  .analysis-row .bar{height:9px;margin-top:10px}
  .profile-balance{display:grid;grid-template-columns:minmax(240px,1fr) minmax(320px,.9fr);align-items:center;gap:24px;padding:24px 30px}
  .profile-balance .big{font-size:38px;margin:8px 0 0}
  .profile-balance .split{padding-left:24px;border-left:1px solid #ffffff2b}
  .profile-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:22px;align-items:start}
  .profile-goals,.profile-tools{min-width:0}
  .profile-goals .goal{padding:18px 20px;border:1px solid var(--line);margin:12px 0}
  .profile-tools .card{padding:20px}
  .data-tools .btn{max-width:100%}
  .foot{text-align:left;font-size:11px;padding:20px 0}

  .sheet{border-radius:22px;max-height:80vh}

}
@media(min-width:1250px){
  .shell{grid-template-columns:260px minmax(0,1fr)}
  main{padding-left:58px;padding-right:58px}
  .dashboard-grid{gap:24px}
  .records-layout{grid-template-columns:280px minmax(0,1fr);gap:28px}
}
\n</style>

<body><div class="shell"><main id="app"></main><nav class="nav" id="nav" aria-label="主要導覽"></nav></div><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast" role="status"></div><input id="jsonfile" type="file" accept=".json,application/json" hidden><input id="csvfile" type="file" accept=".csv,text/csv" hidden>
<script>
(()=>{
'use strict';
const KEY='daily-ledger-local-v1',defaults={expense:['餐飲','交通','購物','生活','娛樂','醫療','學習','其他'],income:['薪資','兼職','獎金','利息','投資','退款','禮金','其他']},emoji={餐飲:'🍜',交通:'🚆',購物:'🛍️',生活:'🏠',娛樂:'🎬',醫療:'🩺',學習:'📚',薪資:'💼',兼職:'🧑‍💻',獎金:'🎁',利息:'💹',投資:'📈',退款:'↩️',禮金:'🧧',其他:'✦'},colors=['#176b58','#83a98f','#b9c9a8','#d6a17e','#d67b5e','#8c9db3','#b3a3c9','#c7b77a'];
const $=s=>document.querySelector(s),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{let d=new Date(Date.now()-new Date().getTimezoneOffset()*60000);return d.toISOString().slice(0,10)},thisMonth=()=>today().slice(0,7);
let data=(()=>{try{let d=JSON.parse(localStorage.getItem(KEY));return{transactions:Array.isArray(d.transactions)?d.transactions:[],categories:d.categories||structuredClone(defaults),goals:Array.isArray(d.goals)?d.goals:[],budgets:d.budgets||{}}}catch{return{transactions:[],categories:structuredClone(defaults),goals:[],budgets:{}}}})();
let tab='home',month=thisMonth(),filter='all',kind='expense',draft=null,selectedCat='',query='';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{toast('儲存空間不足，請先匯出備份')}},money=n=>'NT$'+Math.round(+n||0).toLocaleString('zh-TW'),sum=(xs,k)=>xs.filter(x=>x.type===k).reduce((a,x)=>a+(+x.amount||0),0),items=()=>data.transactions.filter(x=>x.date?.slice(0,7)===month),pct=(a,b)=>b?Math.min(100,a/b*100):0,icon=c=>emoji[c]||'✦';
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2100)}
function nav(){let a=[['home','▦','總覽'],['add','✎','記帳'],['analysis','⌁','分析'],['profile','▱','我的']];$('#nav').innerHTML=a.map(x=>'<button data-tab="'+x[0]+'" class="'+(tab===x[0]?'on':'')+'"><b>'+x[1]+'</b>'+x[2]+'</button>').join('')}
function top(){return '<div class="top"><div class="brand"><span class="mark">＝</span>日序</div><span class="muted">'+today()+'・'+new Intl.DateTimeFormat('zh-TW',{weekday:'short'}).format(new Date())+'</span></div>'}
function row(t,button=true){return '<'+(button?'button':'div')+' class="row" '+(button?'data-edit="'+safe(t.id)+'"':'')+'><span class="ico">'+icon(t.category)+'</span><span style="min-width:0"><span class="desc">'+safe(t.description||t.category)+'</span><span class="meta">'+safe(t.category)+'・'+safe(t.date)+'・'+safe(t.account||'現金')+(t.invoiceNo?'・發票 '+safe(t.invoiceNo):'')+'</span></span><span class="val '+t.type+'">'+(t.type==='income'?'+':'−')+Math.round(t.amount).toLocaleString('zh-TW')+'</span></'+(button?'button':'div')+'>'}
function home(){let xs=data.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7),m=items(),inc=sum(m,'income'),out=sum(m,'expense'),cats=data.categories.expense.slice(0,5);return '<section class="dashboard-page">'+top()+'<div class="dashboard-grid"><div class="balance dashboard-balance"><div><small>全部紀錄・累計結餘</small><div class="big">'+money(sum(data.transactions,'income')-sum(data.transactions,'expense'))+'</div></div><div class="split"><div><span>本月收入</span><b>'+money(inc)+'</b></div><div><span>本月支出</span><b>'+money(out)+'</b></div></div></div><div class="card dashboard-quick"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div><b>快速記一筆</b><div class="muted" style="margin-top:4px">記下今天的每一筆收支</div></div><button class="btn soft" data-tab="add">完整記帳＋</button></div><div class="seg"><button class="on" data-qtype="expense">支出</button><button data-qtype="income">收入</button></div><input class="amount" id="quickamount" type="number" min="1" inputmode="decimal" placeholder="NT$ 輸入金額"><div id="quickcats" class="chips">'+cats.map((c,i)=>'<button class="chip '+(!i?'on':'')+'" data-qcat="'+safe(c)+'">'+icon(c)+' '+safe(c)+'</button>').join('')+'</div><button class="btn primary full" style="margin-top:14px" data-action="quick-save">儲存紀錄</button></div><div class="dashboard-recent"><div class="head" style="margin-top:0"><div><h2>最近紀錄</h2><div class="muted" style="margin-top:4px">最近新增的 7 筆收支</div></div><button class="link" data-tab="records">查看全部 ›</button></div>'+(xs.length?'<div class="card">'+xs.map(t=>row(t)).join('')+'</div>':'<div class="empty">✦<b>開始你的第一筆記帳</b>從一筆小小的紀錄，慢慢看見金錢流向。</div>')+'</div></div><div class="foot">資料只保存在這台裝置的瀏覽器<br>請定期匯出 JSON 備份。</div></section>'}
function add(){if(!draft)draft={id:'',type:'expense',amount:'',category:data.categories.expense[0],description:'',date:today(),account:'現金',invoiceNo:'',note:''};let cats=data.categories[draft.type]||[];if(!cats.includes(draft.category))draft.category=cats[0]||'其他';return '<section class="entry-page"><div class="page-head"><div><h1>'+(draft.id?'編輯紀錄':'新增收支')+'</h1><p class="page-subtitle">填寫金額、分類與交易資訊，整理每一筆日常收支。</p></div><button class="btn soft" data-action="cancel">取消</button></div><div class="seg entry-type"><button class="'+(draft.type==='expense'?'on':'')+'" data-type="expense">支出</button><button class="'+(draft.type==='income'?'on':'')+'" data-type="income">收入</button></div><div class="entry-layout"><div class="card entry-amount-card"><label class="muted">'+(draft.type==='expense'?'支出':'收入')+'金額</label><input class="amount" id="amount" type="number" min="1" inputmode="decimal" value="'+safe(draft.amount)+'" placeholder="0"><div class="entry-category-heading"><b>選擇分類</b><button class="link" data-action="categories">管理分類</button></div><div class="chips">'+cats.map(c=>'<button class="chip '+(draft.category===c?'on':'')+'" data-cat="'+safe(c)+'">'+icon(c)+' '+safe(c)+'</button>').join('')+'</div></div><div class="card entry-details-card"><div class="field"><label>項目名稱 *</label><input id="description" maxlength="60" value="'+safe(draft.description)+'" placeholder="例如：午餐便當、每月薪資"></div><div class="grid2"><div class="field"><label>日期 *</label><input id="date" type="date" value="'+safe(draft.date)+'"></div><div class="field"><label>帳戶</label><select id="account">'+['現金','銀行','信用卡','電子支付'].map(a=>'<option '+(draft.account===a?'selected':'')+'>'+a+'</option>').join('')+'</select></div></div><div class="field"><label>發票號碼（選填）</label><input id="invoice" maxlength="30" value="'+safe(draft.invoiceNo)+'" placeholder="例如 AB-12345678"></div><div class="field"><label>備註（選填）</label><textarea id="note" rows="3" maxlength="240">'+safe(draft.note)+'</textarea></div></div></div><div class="entry-actions">'+(draft.id?'<button class="btn danger" data-action="delete">刪除紀錄</button>':'')+'<button class="btn primary" data-action="save">'+(draft.id?'儲存修改':'儲存'+(draft.type==='expense'?'支出':'收入'))+'</button></div></section>'}
function records(){let xs=items().filter(x=>(filter==='all'||x.type===filter)&&(!query||[x.description,x.category,x.invoiceNo,x.note].join(' ').toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date)),inc=sum(items(),'income'),out=sum(items(),'expense');return '<section class="records-page"><div class="page-head"><div><h1>收支紀錄</h1><p class="page-subtitle">依月份整理收入與支出，搜尋、檢視或編輯每筆交易。</p></div><button class="btn primary" data-tab="add">＋ 新增紀錄</button></div><div class="month"><button data-action="prev" aria-label="前一個月">‹</button><b>'+month.replace('-',' 年 ')+' 月</b><button data-action="next" aria-label="下一個月">›</button></div><div class="records-layout"><aside class="records-side"><div class="card summary"><div><small>收入</small><b class="income">'+money(inc)+'</b></div><div><small>支出</small><b>'+money(out)+'</b></div><div><small>結餘</small><b>'+money(inc-out)+'</b></div></div><div class="records-filter-panel"><b>交易類型</b><div class="filter">'+[['all','全部'],['expense','支出'],['income','收入']].map(x=>'<button class="'+(filter===x[0]?'on':'')+'" data-filter="'+x[0]+'">'+x[1]+'</button>').join('')+'</div></div></aside><div class="records-main"><input class="search-input" id="search" placeholder="搜尋項目、分類、發票或備註" value="'+safe(query)+'">'+(xs.length?'<div class="card records-list">'+xs.map(t=>row(t)).join('')+'</div>':'<div class="empty">這個月份還沒有符合的紀錄。</div>')+'</div></div></section>'}
function analysis(){let xs=items(),inc=sum(xs,'income'),out=sum(xs,'expense'),type=kind,totals={};xs.filter(x=>x.type===type).forEach(x=>totals[x.category]=(totals[x.category]||0)+Number(x.amount));let rows=Object.entries(totals).sort((a,b)=>b[1]-a[1]),budget=+(data.budgets[month]||0),used=pct(out,budget);return '<section class="analysis-page"><div class="page-head"><div><h1>收支分析</h1><p class="page-subtitle">檢視每月收入、支出結構與預算使用情況。</p></div><div class="month"><button data-action="prev" aria-label="前一個月">‹</button><b>'+month.replace('-',' 年 ')+' 月</b><button data-action="next" aria-label="下一個月">›</button></div></div><div class="analysis-layout"><div class="analysis-overview"><div class="seg"><button class="'+(type==='expense'?'on':'')+'" data-analysis="expense">支出</button><button class="'+(type==='income'?'on':'')+'" data-analysis="income">收入</button></div><div class="balance analysis-balance"><small>本月'+(type==='expense'?'支出':'收入')+'</small><div class="big">'+money(type==='expense'?out:inc)+'</div><div class="split"><div><span>收入</span><b>'+money(inc)+'</b></div><div><span>結餘</span><b>'+money(inc-out)+'</b></div></div></div><div class="card budget-card"><div class="head" style="margin:0"><b>本月支出預算</b><button class="link" data-action="budget">設定／調整 ›</button></div>'+(budget?'<div class="bar"><i style="width:'+used+'%"></i></div><div class="muted" style="display:flex;justify-content:space-between;margin-top:8px"><span>已使用 '+used.toFixed(1)+'% / '+money(budget)+'</span><b>'+ (out>budget?'超出 ':'剩餘 ')+money(Math.abs(budget-out))+'</b></div>':'<p class="muted">設定每月支出上限，追蹤使用率。</p>')+'</div></div><div class="card analysis-breakdown"><div class="head" style="margin-top:0"><h2>'+ (type==='expense'?'支出':'收入')+'分類分布</h2><span class="muted">金額・占比</span></div>'+(rows.length?rows.map((r,i)=>'<div class="analysis-row"><div style="display:flex;justify-content:space-between;font-size:13px"><b>'+icon(r[0])+' '+safe(r[0])+'</b><span>'+money(r[1])+'・'+pct(r[1],type==='expense'?out:inc).toFixed(1)+'%</span></div><div class="bar"><i style="width:'+pct(r[1],type==='expense'?out:inc)+'%;background:'+colors[i%colors.length]+'"></i></div></div>').join(''):'<div class="empty">新增紀錄後，這裡就會出現分類統計。</div>')+'</div></div></section>'}
function profile(){let inc=sum(data.transactions,'income'),out=sum(data.transactions,'expense');return '<section class="profile-page"><div class="page-head"><div><h1>我的帳本</h1><p class="page-subtitle">管理理財目標、分類，以及帳本資料備份。</p></div></div><div class="balance profile-balance"><div><small>累計收支結餘</small><div class="big">'+money(inc-out)+'</div></div><div class="split"><div><span>累計收入</span><b>'+money(inc)+'</b></div><div><span>累計支出</span><b>'+money(out)+'</b></div></div></div><div class="profile-grid"><div class="profile-goals"><div class="head"><h2>我的理財目標</h2><button class="link" data-action="goal-add">新增目標＋</button></div>'+(data.goals.length?data.goals.map(g=>'<div class="goal"><div class="goalrow"><b>'+safe(g.emoji||'🎯')+' '+safe(g.name)+'</b><button class="smallbtn" data-goal-edit="'+safe(g.id)+'">編輯</button></div><div class="muted" style="margin-top:8px">'+money(g.saved)+' / '+money(g.target)+'・'+pct(g.saved,g.target).toFixed(0)+'%</div><div class="bar"><i style="width:'+pct(g.saved,g.target)+'%"></i></div><div style="display:flex;justify-content:flex-end;gap:7px;margin-top:9px"><button class="smallbtn" data-goal-add="'+safe(g.id)+'">＋存入</button><button class="smallbtn" data-goal-del="'+safe(g.id)+'">刪除</button></div></div>').join(''):'<div class="empty">🎯<b>替自己設定一個小目標</b>例如旅行基金或緊急預備金。</div>')+'</div><div class="profile-tools"><div class="head"><h2>分類管理</h2></div><div class="card"><button class="btn soft full" data-action="categories">管理收入與支出分類</button></div><div class="head"><h2>資料管理</h2></div><div class="card data-tools"><button class="btn soft full" data-action="export-json">匯出 JSON 備份</button><button class="btn soft full" style="margin-top:8px" data-action="import-json">匯入 JSON 備份</button><button class="btn soft full" style="margin-top:8px" data-action="export-csv">匯出 CSV 紀錄</button><button class="btn soft full" style="margin-top:8px" data-action="import-csv">匯入 CSV 紀錄</button></div></div></div><div class="foot">日序 / 把日子記得剛剛好<br>資料只儲存於本機瀏覽器</div></section>'}
function render(){nav();$('#app').innerHTML=tab==='home'?home():tab==='add'?add():tab==='records'?records():tab==='analysis'?analysis():profile()}
function open(title,body){$('#sheet').innerHTML='<div class="sheethead"><b>'+title+'</b><button data-action="close">×</button></div>'+body;$('#modal').classList.add('show')}
function close(){ $('#modal').classList.remove('show')}
function categoryModal(type='expense'){kind=type;let cats=data.categories[kind];open('分類管理','<div class="seg"><button class="'+(kind==='expense'?'on':'')+'" data-cat-kind="expense">支出分類</button><button class="'+(kind==='income'?'on':'')+'" data-cat-kind="income">收入分類</button></div>'+cats.map(c=>'<div class="categoryrow"><span>'+icon(c)+' '+safe(c)+'</span><span><button class="smallbtn" data-cat-edit="'+safe(c)+'">改名</button> <button class="smallbtn" data-cat-del="'+safe(c)+'">刪除</button></span></div>').join('')+'<button class="btn primary full" style="margin-top:13px" data-action="cat-add">新增分類＋</button>')}
function download(name,content,type){let u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function exportJSON(){download('日序備份_'+today()+'.json',JSON.stringify({app:'日序',version:1,data},null,2),'application/json');toast('JSON 備份已匯出')}
function exportCSV(){let cols=['日期','類型','項目','分類','金額','帳戶','發票號碼','備註'],rows=data.transactions.map(t=>[t.date,t.type==='income'?'收入':'支出',t.description,t.category,t.amount,t.account,t.invoiceNo,t.note]);download('日序紀錄_'+today()+'.csv','\ufeff'+[cols,...rows].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV 已匯出')}
function saveDraft(){let amount=+$('#amount').value,description=$('#description').value.trim(),date=$('#date').value;if(!amount||amount<=0||!description||!date){toast('請確認金額、項目與日期');return}let tx={...draft,amount,description,date,account:$('#account').value,invoiceNo:$('#invoice').value.trim(),note:$('#note').value.trim(),createdAt:draft.createdAt||new Date().toISOString()};if(draft.id){let i=data.transactions.findIndex(x=>x.id===draft.id);if(i>=0)data.transactions[i]=tx}else{tx.id='tx-'+Date.now();data.transactions.push(tx)}save();draft=null;tab='home';render();toast('紀錄已儲存')}
function parseCSV(text){let rows=[],row=[],v='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){v+='"';i++}else if(c==='"')q=false;else v+=c}else if(c==='"')q=true;else if(c===','){row.push(v);v=''}else if(c==='\n'){row.push(v);rows.push(row);row=[];v=''}else if(c!=='\r')v+=c}row.push(v);if(row.some(Boolean))rows.push(row);return rows}
$('#app').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.edit){let t=data.transactions.find(x=>x.id===b.dataset.edit);if(t){draft={...t};tab='add';render()}return}let a=b.dataset.action;if(a){switch(a){case'quick-save':{let n=+$('#quickamount').value;if(n<=0){toast('請輸入金額');break}data.transactions.push({id:'tx-'+Date.now(),type:kind,amount:n,category:selectedCat||data.categories[kind][0],description:selectedCat||data.categories[kind][0],date:today(),account:'現金',invoiceNo:'',note:''});save();render();toast('快速記帳完成');break}case'save':saveDraft();break;case'cancel':draft=null;tab='home';render();break;case'delete':if(confirm('確定刪除這筆紀錄？')){data.transactions=data.transactions.filter(x=>x.id!==draft.id);save();draft=null;tab='records';render();toast('紀錄已刪除')}break;case'prev':month=new Date(+month.slice(0,4),+month.slice(5)-2,1).toISOString().slice(0,7);render();break;case'next':month=new Date(+month.slice(0,4),+month.slice(5),1).toISOString().slice(0,7);render();break;case'budget':{let v=prompt('設定 '+month+' 的支出預算（0 清除）',data.budgets[month]||'');if(v!==null&&Number(v)>=0){if(+v)data.budgets[month]=+v;else delete data.budgets[month];save();render()}break}case'categories':categoryModal();break;case'cat-add':{let n=prompt('新增分類名稱');if(n?.trim()&&!data.categories[kind].includes(n.trim()))data.categories[kind].push(n.trim());save();categoryModal(kind);break}case'goal-add':goalEdit();break;case'export-json':exportJSON();break;case'export-csv':exportCSV();break;case'import-json':$('#jsonfile').click();break;case'import-csv':$('#csvfile').click();break;case'close':close();break}}
if(b.dataset.qtype){kind=b.dataset.qtype;selectedCat='';$$('#quickcats .chip').forEach(x=>x.remove());let cs=data.categories[kind].slice(0,5);$('#quickcats').innerHTML=cs.map((c,i)=>'<button class="chip '+(!i?'on':'')+'" data-qcat="'+safe(c)+'">'+safe(c)+'</button>').join('');selectedCat=cs[0]||''}
if(b.dataset.qcat){selectedCat=b.dataset.qcat;$$('#quickcats .chip').forEach(x=>x.classList.toggle('on',x===b))}
if(b.dataset.type){syncDraft();draft.type=b.dataset.type;draft.category=data.categories[draft.type][0];render()}
if(b.dataset.cat){draft.category=b.dataset.cat;$$('#app .chip[data-cat]').forEach(x=>x.classList.toggle('on',x===b))}
if(b.dataset.filter){filter=b.dataset.filter;render()}
if(b.dataset.analysis){kind=b.dataset.analysis;render()}
if(b.dataset.catKind){categoryModal(b.dataset.catKind)}
if(b.dataset.catEdit){let old=b.dataset.catEdit,n=prompt('修改分類名稱',old)?.trim();if(n&&n!==old&&!data.categories[kind].includes(n)){data.categories[kind]=data.categories[kind].map(x=>x===old?n:x);data.transactions.forEach(t=>{if(t.type===kind&&t.category===old)t.category=n});save();categoryModal(kind)}}
if(b.dataset.catDel){let old=b.dataset.catDel;if(confirm('刪除分類 '+old+'？既有交易不會刪除。')){data.categories[kind]=data.categories[kind].filter(x=>x!==old);save();categoryModal(kind)}}
if(b.dataset.goalEdit){let g=data.goals.find(x=>x.id===b.dataset.goalEdit);goalEdit(g)}
if(b.dataset.goalAdd){let g=data.goals.find(x=>x.id===b.dataset.goalAdd),n=+prompt('存入金額');if(g&&n>0){g.saved+=n;save();render()}}
if(b.dataset.goalDel){if(confirm('刪除這個目標？')){data.goals=data.goals.filter(x=>x.id!==b.dataset.goalDel);save();render()}}
});
function $$(s){return [...document.querySelectorAll(s)]}
function syncDraft(){if(!draft)return;draft.amount=$('#amount')?.value||'';draft.description=$('#description')?.value||'';draft.date=$('#date')?.value||draft.date;draft.account=$('#account')?.value||draft.account;draft.invoiceNo=$('#invoice')?.value||'';draft.note=$('#note')?.value||''}
function goalEdit(g){let name=prompt('目標名稱',g?.name||'旅行基金');if(name===null)return;let target=+prompt('目標金額',g?.target||20000);if(!name.trim()||target<=0)return;let saved=+prompt('目前已存金額',g?.saved||0);let obj={id:g?.id||'goal-'+Date.now(),name:name.trim(),target,saved:Math.max(0,saved),emoji:g?.emoji||'🎯'};if(g)data.goals=data.goals.map(x=>x.id===g.id?obj:x);else data.goals.push(obj);save();render()}
$('#nav').addEventListener('click',e=>{
  const b=e.target.closest('[data-tab]');
  if(!b)return;
  tab=b.dataset.tab;
  render();
});
$('#sheet').addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(!b)return;
  if(b.dataset.action==='close'){close();return;}
  if(b.dataset.catKind){categoryModal(b.dataset.catKind);return;}
  if(b.dataset.action==='cat-add'){
    const n=prompt('新增分類名稱');
    if(n&&n.trim()&&!data.categories[kind].includes(n.trim()))data.categories[kind].push(n.trim());
    save();categoryModal(kind);return;
  }
  if(b.dataset.catEdit){
    const old=b.dataset.catEdit,n=prompt('修改分類名稱',old)?.trim();
    if(n&&n!==old&&!data.categories[kind].includes(n)){
      data.categories[kind]=data.categories[kind].map(x=>x===old?n:x);
      data.transactions.forEach(t=>{if(t.type===kind&&t.category===old)t.category=n;});
      save();categoryModal(kind);
    }
    return;
  }
  if(b.dataset.catDel){
    const old=b.dataset.catDel;
    if(confirm('刪除分類 '+old+'？既有交易不會刪除。')){
      data.categories[kind]=data.categories[kind].filter(x=>x!==old);
      save();categoryModal(kind);
    }
  }
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')close()});
$('#app').addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let pos=e.target.selectionStart;render();let f=$('#search');f.focus();f.setSelectionRange(pos,pos)}});
$('#jsonfile').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result),s=d.data||d;if(!Array.isArray(s.transactions)||!s.categories)throw Error('格式不正確');if(confirm('以備份內容取代目前帳本？取消則合併紀錄。'))data={transactions:s.transactions,categories:s.categories,goals:s.goals||[],budgets:s.budgets||{}};else{let ids=new Set(data.transactions.map(x=>x.id));s.transactions.forEach(x=>{if(!ids.has(x.id))data.transactions.push(x)});['expense','income'].forEach(k=>(s.categories[k]||[]).forEach(c=>{if(!data.categories[k].includes(c))data.categories[k].push(c)}));data.goals.push(...(s.goals||[]).filter(g=>!data.goals.some(x=>x.id===g.id)));Object.assign(data.budgets,s.budgets||{})}save();render();toast('備份已匯入')}catch(err){alert('匯入失敗：'+err.message)}e.target.value=''};r.readAsText(f)});
$('#csvfile').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let rows=parseCSV(String(r.result).replace(/^\ufeff/,'')),h=rows.shift(),idx=(...names)=>h.findIndex(x=>names.includes(x));let count=0;rows.forEach(row=>{let date=row[idx('日期','date')],t=row[idx('類型','type')],amount=+row[idx('金額','amount')],type=['收入','income'].includes(t)?'income':['支出','expense'].includes(t)?'expense':'';if(!date||!type||amount<=0)return;let category=row[idx('分類','category')]||'其他';if(!data.categories[type].includes(category))data.categories[type].push(category);data.transactions.push({id:'tx-'+Date.now()+'-'+count++,date,type,amount,category,description:row[idx('項目','description')]||category,account:row[idx('帳戶','account')]||'現金',invoiceNo:row[idx('發票號碼','invoiceNo')]||'',note:row[idx('備註','note')]||''})});if(!count)throw Error('沒有可匯入的資料');save();render();toast('已匯入 '+count+' 筆')}catch(err){alert('CSV 匯入失敗：'+err.message)}e.target.value=''};r.readAsText(f)});
if('serviceWorker'in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));
render();
})();
</script></body></html>
